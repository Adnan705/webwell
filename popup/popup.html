<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebWell</title>
<link rel="stylesheet" href="popup.css?v=1.9.0">
<link rel="stylesheet" href="../lib/plus.css?v=1.9.0">
</head>
<body>
  <div class="pop">
    <header class="top">
      <div class="brand">
        <img class="logo" src="../icons/icon48.png" alt="">
        <div class="brand-t"><strong>WebWell</strong><small id="dateLine"></small></div>
      </div>
      <div class="top-actions">
        <button class="ico-btn save-btn" id="saveTab" hidden></button>
        <button class="pill" id="trackPill" title="Pause or resume tracking"></button>
        <button class="ico-btn" id="openDash" title="Open dashboard" aria-label="Open dashboard"></button>
      </div>
    </header>

    <nav class="seg" id="tabs" role="tablist" aria-label="WebWell">
      <button role="tab" data-tab="today" class="on">Today</button>
      <button role="tab" data-tab="focus">Focus</button>
      <button role="tab" data-tab="protect">Protect</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>

    <div class="mini" id="mini" hidden>
      <img id="miniArt" src="../newtab/img/lofi-disc.webp" alt="">
      <div class="mini-t"><b id="miniTitle"></b><small id="miniSub"></small></div>
      <button class="sq" id="miniPrev" title="Previous" aria-label="Previous"></button>
      <button class="sq main" id="miniToggle" title="Pause or play" aria-label="Pause or play"></button>
      <button class="sq" id="miniNext" title="Next" aria-label="Next"></button>
      <button class="sq" id="miniStop" title="Stop and close" aria-label="Stop music"></button>
    </div>

    <main class="view" id="view" aria-live="polite"></main>
    <button class="goplus" id="goPlus" type="button" hidden aria-label="See what WebWell Plus adds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10l3.5 5L12 20.5 3.5 9z"/><path d="M3.5 9h17M9.5 4L8 9l4 11.5L16 9l-1.5-5"/></svg>
      <span class="gp-t"><b>Go Plus</b><small>See what you can unlock</small></span>
      <svg class="gp-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="../lib/time.js?v=1.9.0"></script>
  <script src="../lib/categories.js?v=1.9.0"></script>
  <script src="../lib/protect.js?v=1.9.0"></script>
<script src="../lib/plus.js?v=1.9.0"></script>
  <script src="../lib/plus-focus.js?v=1.9.0"></script>
  <script src="popup.js?v=1.9.0"></script>
</body>
</html>
