<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1302 706" role="img" aria-labelledby="t d" font-family="Geist, system-ui, Segoe UI, sans-serif">
<title id="t">Permissions requested by seven open-source new tab and focus extensions</title>
<desc id="d">A grid with one row per extension and one column per permission. A filled circle means the permission is required at install, a ring means it is optional. Tabliss and Bonjourr require only storage. LeechBlock NG and ActivityWatch Web Watcher require access to all sites. WebWell requires the most named permissions, eleven, and makes all-sites access optional.</desc>
<rect width="1302" height="706" fill="#ffffff"/>
<text x="24" y="42" font-size="26" font-weight="700" fill="#18171c" letter-spacing="-0.5">What do new tab and focus extensions ask for?</text>
